services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file: .env.local
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      # Le code de ton dossier, modifiable en direct
      - .:/app
      # node_modules et .next restent dans Docker (pas mélangés avec Windows)
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache:
