services:
  # Développement : docker compose up --build
  web:
    build: .
    ports:
      - "3000:3000"
    env_file: .env.local
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      # Le code de ton dossier, modifiable en direct
      - .:/app
      # node_modules et .next restent dans Docker (pas mélangés avec Windows)
      - node_modules:/app/node_modules
      - next_cache:/app/.next

  # Version optimisée (comme en ligne), pour juger la vitesse réelle :
  #   docker compose --profile prod up --build web-prod
  web-prod:
    build: .
    profiles: ["prod"]
    ports:
      - "3000:3000"
    env_file: .env.local
    command: sh -c "npx next build && npx next start --hostname 0.0.0.0 --port 3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_prod:/app/.next

volumes:
  node_modules:
  next_cache:
  next_prod:
