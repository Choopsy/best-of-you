services:
  # Développement : docker compose up --build
  web:
    build: .
    ports:
      - "3000:3000"
    env_file: .env.local
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      # Le code de ton dossier, modifiable en direct
      - .:/app
      # node_modules et .next restent dans Docker (pas mélangés avec Windows)
      - node_modules:/app/node_modules
      - next_cache:/app/.next

  # Version optimisée (comme en ligne), pour juger la vitesse réelle :
  #   docker compose --profile prod up --build web-prod
  web-prod:
    build: .
    profiles: ["prod"]
    ports:
      - "3000:3000"
    env_file: .env.local
    command: sh -c "npx next build && npx next start --hostname 0.0.0.0 --port 3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_prod:/app/.next

  # Tests sans rien installer sur Windows (ni Node, ni npm, ni Chromium) :
  #   docker compose run --rm test                     tout (typage, unitaires, base, navigateur)
  #   docker compose run --rm test npm run test:e2e -- courses
  # Image officielle Playwright : même version que dans package.json, Chromium déjà dedans.
  test:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: ["test"]
    working_dir: /app
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      # Paquets Linux à part (ceux de Windows ne marchent pas ici, et inversement)
      - node_modules_test:/app/node_modules
      # Base Postgres jetable et build de test hors du dossier Windows : Postgres exige
      # des droits Unix (chmod 700) qu'un dossier Windows monté ne sait pas donner
      - tests_tmp:/app/tests/.tmp
      - next_e2e:/app/.next-e2e
    # Réinstalle les paquets seulement quand package-lock.json a changé
    entrypoint:
      - sh
      - -c
      - |
        h=$$(sha1sum package-lock.json | cut -c1-40)
        if [ "$$(cat node_modules/.lock-hash 2>/dev/null)" != "$$h" ]; then
          npm ci --no-audit --no-fund && echo "$$h" > node_modules/.lock-hash || exit 1
        fi
        exec "$$@"
      - --
    command: ["sh", "-c", "npx tsc --noEmit && npm run test:all"]

volumes:
  node_modules:
  node_modules_test:
  tests_tmp:
  next_e2e:
  next_cache:
  next_prod:
